<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1110" width="1200" height="1110">

  <!-- Fons -->
  <rect x="0" y="0" width="1200" height="1110" fill="#ffffff" />

  <!-- Capçalera -->
  <text x="600" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#1f2328">Regles per crear funcions</text>
  <text x="600" y="100" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#57606a">Una funció rep dades pels paràmetres, calcula i retorna el resultat.</text>

  <!-- ===== Panell 1: no escriure ===== -->
  <rect x="0" y="0" width="560" height="405" rx="14" fill="#fff5f5" stroke="#cf222e" stroke-width="2" transform="translate(30,135)" />
    <path d="M14 0 H546 A14 14 0 0 1 560 14 V54 H0 V14 A14 14 0 0 1 14 0 Z" fill="#cf222e" transform="translate(30,135)" />
    <circle r="15" fill="#ffffff" transform="translate(62,162)" />
      <path d="M-6 -6 L6 6 M6 -6 L-6 6" fill="none" stroke="#cf222e" stroke-width="3.2" stroke-linecap="round" transform="translate(62,162)" />
    <text x="58" y="35" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#ffffff" transform="translate(30,135)">No escriure per pantalla</text>
    <rect x="16" y="68" width="528" height="286" rx="8" fill="#f6f8fa" transform="translate(30,135)" />
    <rect x="16" y="124" width="528" height="28" fill="#cf222e" opacity="0.15" transform="translate(30,135)" />
    <rect x="16" y="172" width="528" height="28" fill="#cf222e" opacity="0.15" transform="translate(30,135)" />
    <rect x="16" y="220" width="528" height="28" fill="#cf222e" opacity="0.15" transform="translate(30,135)" />
    <text x="30" y="96" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(30,135)"><tspan fill="#8250df">static</tspan> <tspan fill="#0550ae">string</tspan> <tspan fill="#953800">Saluda</tspan>(<tspan fill="#0550ae">string</tspan> nom, <tspan fill="#0550ae">string</tspan> idioma) {</text>
    <text x="30" y="120" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(30,135)">    <tspan fill="#8250df">if</tspan> (idioma == <tspan fill="#0a3069">"ca"</tspan>) {</text>
    <text x="30" y="144" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(30,135)">        Console.<tspan fill="#953800">WriteLine</tspan>(<tspan fill="#0a3069">"Bon dia "</tspan> + nom);</text>
    <text x="30" y="168" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(30,135)">    } <tspan fill="#8250df">else if</tspan> (idioma == <tspan fill="#0a3069">"es"</tspan>) {</text>
    <text x="30" y="192" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(30,135)">        Console.<tspan fill="#953800">WriteLine</tspan>(<tspan fill="#0a3069">"Buenos días "</tspan> + nom);</text>
    <text x="30" y="216" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(30,135)">    } <tspan fill="#8250df">else</tspan> {</text>
    <text x="30" y="240" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(30,135)">        Console.<tspan fill="#953800">WriteLine</tspan>(<tspan fill="#0a3069">"Good morning "</tspan> + nom);</text>
    <text x="30" y="264" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(30,135)">    }</text>
    <text x="30" y="288" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(30,135)">}</text>
    <text x="20" y="384" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2328" transform="translate(30,135)">La funció <tspan font-weight="700">retorna</tspan> el text. Qui l'escriu és el <tspan font-weight="700">Main</tspan>.</text>
  <!-- ===== Panell 2: no llegir ===== -->
  <rect x="0" y="0" width="560" height="405" rx="14" fill="#fff5f5" stroke="#cf222e" stroke-width="2" transform="translate(610,135)" />
    <path d="M14 0 H546 A14 14 0 0 1 560 14 V54 H0 V14 A14 14 0 0 1 14 0 Z" fill="#cf222e" transform="translate(610,135)" />
    <circle r="15" fill="#ffffff" transform="translate(642,162)" />
      <path d="M-6 -6 L6 6 M6 -6 L-6 6" fill="none" stroke="#cf222e" stroke-width="3.2" stroke-linecap="round" transform="translate(642,162)" />
    <text x="58" y="35" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#ffffff" transform="translate(610,135)">No llegir de teclat</text>
    <rect x="16" y="68" width="528" height="286" rx="8" fill="#f6f8fa" transform="translate(610,135)" />
    <rect x="16" y="100" width="528" height="28" fill="#cf222e" opacity="0.15" transform="translate(610,135)" />
    <text x="30" y="96" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(610,135)"><tspan fill="#8250df">static</tspan> <tspan fill="#0550ae">string</tspan> <tspan fill="#953800">Saluda</tspan>(<tspan fill="#0550ae">string</tspan> nom) {</text>
    <text x="30" y="120" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(610,135)">    <tspan fill="#0550ae">string</tspan> idioma = Console.<tspan fill="#953800">ReadLine</tspan>();</text>
    <text x="30" y="144" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(610,135)">    ...</text>
    <text x="30" y="168" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(610,135)">}</text>
    <text x="20" y="364" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2328" transform="translate(610,135)">Les dades s'envien a través dels paràmetres de la funció.</text>
    <text x="20" y="384" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2328" transform="translate(610,135)">Qui demana les dades és el <tspan font-weight="700">Main</tspan>.</text>
  <!-- ===== Panell 3: més d'un return ===== -->
  <rect x="0" y="0" width="560" height="405" rx="14" fill="#fff5f5" stroke="#cf222e" stroke-width="2" transform="translate(30,560)" />
    <path d="M14 0 H546 A14 14 0 0 1 560 14 V54 H0 V14 A14 14 0 0 1 14 0 Z" fill="#cf222e" transform="translate(30,560)" />
    <circle r="15" fill="#ffffff" transform="translate(62,587)" />
      <path d="M-6 -6 L6 6 M6 -6 L-6 6" fill="none" stroke="#cf222e" stroke-width="3.2" stroke-linecap="round" transform="translate(62,587)" />
    <text x="58" y="35" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#ffffff" transform="translate(30,560)">Més d'un return</text>
    <rect x="16" y="68" width="528" height="286" rx="8" fill="#f6f8fa" transform="translate(30,560)" />
    <rect x="16" y="124" width="528" height="28" fill="#cf222e" opacity="0.15" transform="translate(30,560)" />
    <rect x="16" y="172" width="528" height="28" fill="#cf222e" opacity="0.15" transform="translate(30,560)" />
    <rect x="16" y="220" width="528" height="28" fill="#cf222e" opacity="0.15" transform="translate(30,560)" />
    <text x="30" y="96" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(30,560)"><tspan fill="#8250df">static</tspan> <tspan fill="#0550ae">string</tspan> <tspan fill="#953800">Saluda</tspan>(<tspan fill="#0550ae">string</tspan> nom, <tspan fill="#0550ae">string</tspan> idioma) {</text>
    <text x="30" y="120" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(30,560)">    <tspan fill="#8250df">if</tspan> (idioma == <tspan fill="#0a3069">"ca"</tspan>) {</text>
    <text x="30" y="144" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(30,560)">        <tspan fill="#8250df">return</tspan> <tspan fill="#0a3069">"Bon dia "</tspan> + nom;</text>
    <text x="30" y="168" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(30,560)">    } <tspan fill="#8250df">else if</tspan> (idioma == <tspan fill="#0a3069">"es"</tspan>) {</text>
    <text x="30" y="192" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(30,560)">        <tspan fill="#8250df">return</tspan> <tspan fill="#0a3069">"Buenos días "</tspan> + nom;</text>
    <text x="30" y="216" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(30,560)">    } <tspan fill="#8250df">else</tspan> {</text>
    <text x="30" y="240" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(30,560)">        <tspan fill="#8250df">return</tspan> <tspan fill="#0a3069">"Good morning "</tspan> + nom;</text>
    <text x="30" y="264" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(30,560)">    }</text>
    <text x="30" y="288" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(30,560)">}</text>
    <text x="20" y="384" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2328" transform="translate(30,560)">Només hi ha d'haver <tspan font-weight="700">un únic return</tspan>, al final.</text>
  <!-- ===== Panell 4: correcte ===== -->
  <rect x="0" y="0" width="560" height="405" rx="14" fill="#f0fbf3" stroke="#1a7f37" stroke-width="2" transform="translate(610,560)" />
    <path d="M14 0 H546 A14 14 0 0 1 560 14 V54 H0 V14 A14 14 0 0 1 14 0 Z" fill="#1a7f37" transform="translate(610,560)" />
    <circle r="15" fill="#ffffff" transform="translate(642,587)" />
      <path d="M-7 0 L-2 5 L7 -5" fill="none" stroke="#1a7f37" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" transform="translate(642,587)" />
    <text x="58" y="35" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#ffffff" transform="translate(610,560)">Correcte!</text>
    <rect x="16" y="68" width="528" height="286" rx="8" fill="#f6f8fa" transform="translate(610,560)" />
    <rect x="16" y="100" width="528" height="28" fill="#1a7f37" opacity="0.15" transform="translate(610,560)" />
    <rect x="16" y="292" width="528" height="28" fill="#1a7f37" opacity="0.15" transform="translate(610,560)" />
    <text x="30" y="96" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(610,560)"><tspan fill="#8250df">static</tspan> <tspan fill="#0550ae">string</tspan> <tspan fill="#953800">Saluda</tspan>(<tspan fill="#0550ae">string</tspan> nom, <tspan fill="#0550ae">string</tspan> idioma) {</text>
    <text x="30" y="120" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(610,560)">    <tspan fill="#0550ae">string</tspan> frase = <tspan fill="#0a3069">""</tspan>;</text>
    <text x="30" y="144" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(610,560)">    <tspan fill="#8250df">if</tspan> (idioma == <tspan fill="#0a3069">"ca"</tspan>) {</text>
    <text x="30" y="168" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(610,560)">        frase = <tspan fill="#0a3069">"Bon dia "</tspan> + nom;</text>
    <text x="30" y="192" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(610,560)">    } <tspan fill="#8250df">else if</tspan> (idioma == <tspan fill="#0a3069">"es"</tspan>) {</text>
    <text x="30" y="216" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(610,560)">        frase = <tspan fill="#0a3069">"Buenos días "</tspan> + nom;</text>
    <text x="30" y="240" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(610,560)">    } <tspan fill="#8250df">else</tspan> {  <tspan fill="#6e7781" font-style="italic">// per defecte: anglès</tspan></text>
    <text x="30" y="264" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(610,560)">        frase = <tspan fill="#0a3069">"Good morning "</tspan> + nom;</text>
    <text x="30" y="288" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(610,560)">    }</text>
    <text x="30" y="312" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(610,560)">    <tspan fill="#8250df">return</tspan> frase;</text>
    <text x="30" y="336" xml:space="preserve" font-family="'Courier New', Courier, monospace" font-size="17" fill="#1f2328" transform="translate(610,560)">}</text>
    <!-- Etiquetes -->
    <rect x="300" y="102" width="232" height="24" rx="12" fill="#1a7f37" transform="translate(610,560)" />
    <text x="416" y="119" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" transform="translate(610,560)">Declarar la variable de retorn</text>
    <rect x="300" y="294" width="232" height="24" rx="12" fill="#1a7f37" transform="translate(610,560)" />
    <text x="416" y="311" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" transform="translate(610,560)">Retornar la variable de retorn</text>
    <text x="20" y="384" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#1f2328" transform="translate(610,560)">Es declara una <tspan font-weight="700">variable de retorn</tspan> al principi i es retorna al final.</text>
  <!-- ===== Peu: qui fa què ===== -->
  <rect x="0" y="0" width="1140" height="90" rx="14" fill="#f6f8fa" stroke="#d0d7de" transform="translate(30,995)" />
    <text x="570" y="30" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#57606a" transform="translate(30,995)">QUI FA QUÈ?</text>
    <rect x="40" y="44" width="300" height="34" rx="17" fill="#0969da" transform="translate(30,995)" />
    <text x="190" y="66" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff" transform="translate(30,995)">Main llegeix les dades</text>
    <path d="M352 61 H408" stroke="#57606a" stroke-width="2.5" transform="translate(30,995)" />
    <path d="M408 54 L420 61 L408 68 Z" fill="#57606a" transform="translate(30,995)" />
    <rect x="430" y="44" width="280" height="34" rx="17" fill="#1a7f37" transform="translate(30,995)" />
    <text x="570" y="66" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff" transform="translate(30,995)">La funció calcula i retorna</text>
    <path d="M722 61 H778" stroke="#57606a" stroke-width="2.5" transform="translate(30,995)" />
    <path d="M778 54 L790 61 L778 68 Z" fill="#57606a" transform="translate(30,995)" />
    <rect x="800" y="44" width="300" height="34" rx="17" fill="#0969da" transform="translate(30,995)" />
    <text x="950" y="66" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#ffffff" transform="translate(30,995)">Main escriu el resultat</text>
  </svg>