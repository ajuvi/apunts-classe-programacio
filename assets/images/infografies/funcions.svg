    <text
   class="code"
   x="30"
   y="96"
   id="text11"><tspan
   class="kw"
   id="tspan7">static</tspan> <tspan
   class="ty"
   id="tspan8">string</tspan> <tspan
   class="fn"
   id="tspan9">Saluda</tspan>(<tspan
   class="ty"
   id="tspan10">string</tspan> nom, <tspan
   class="ty"
   id="tspan11">string</tspan> idioma) {</text>
    <text
   class="code"
   x="30"
   y="120"
   id="text13">    <tspan
   class="kw"
   id="tspan12">if</tspan> (idioma == <tspan
   class="st"
   id="tspan13">&quot;ca&quot;</tspan>) {</text>
    <text
   class="code"
   x="30"
   y="144"
   id="text15">        Console.<tspan
   class="fn"
   id="tspan14">WriteLine</tspan>(<tspan
   class="st"
   id="tspan15">&quot;Bon dia &quot;</tspan> + nom);</text>
    <text
   class="code"
   x="30"
   y="168"
   id="text17">    } <tspan
   class="kw"
   id="tspan16">else if</tspan> (idioma == <tspan
   class="st"
   id="tspan17">&quot;es&quot;</tspan>) {</text>
    <text
   class="code"
   x="30"
   y="192"
   id="text19">        Console.<tspan
   class="fn"
   id="tspan18">WriteLine</tspan>(<tspan
   class="st"
   id="tspan19">&quot;Buenos días &quot;</tspan> + nom);</text>
    <text
   class="code"
   x="30"
   y="216"
   id="text20">    } <tspan
   class="kw"
   id="tspan20">else</tspan> {</text>
    <text
   class="code"
   x="30"
   y="240"
   id="text22">        Console.<tspan
   class="fn"
   id="tspan21">WriteLine</tspan>(<tspan
   class="st"
   id="tspan22">&quot;Good morning &quot;</tspan> + nom);</text>
    <text
   class="code"
   x="30"
   y="264"
   id="text23">    }</text>
    <text
   class="code"
   x="30"
   y="288"
   id="text24">}</text>
    <text
   class="note"
   x="20"
   y="384"
   id="text25">La funció <tspan
   font-weight="700"
   id="tspan24">retorna</tspan> el text. Qui l'escriu és el <tspan
   font-weight="700"
   id="tspan25">Main</tspan>.</text>
  </g>

